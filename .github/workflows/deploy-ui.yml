name: UI Build and Push to ECR

on:
  push:
    branches:
      - release/dev  # ⚠️ Update this if your primary branch is different (e.g., 'master' or 'dev')
  workflow_dispatch: # Allow manual trigger for testing test

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: PB-SOL-DEV
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env.production file
        env:
          ENV_PRODUCTION_CONTENT: ${{ secrets.ENV_PRODUCTION_FILE }}
        run: |
          echo "$ENV_PRODUCTION_CONTENT" > .env.production

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pb-sol-ui-vite
          BUILD_ENV: production
        run: |
          # Use current timestamp for versioning
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          echo "Building Docker image..."
          docker build --build-arg BUILD_ENV=$BUILD_ENV -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Tagging Docker image with timestamp..."
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP
          
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP" >> $GITHUB_OUTPUT
